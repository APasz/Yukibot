[project]
name = "yukibot"
version = "0.1.0"
description = "Discord bot for game server management, voice features, and automation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles",
    "aioftp",
    "aiohttp",
    "anyio",
    "brotli",
    "cryptography>=46.0.7,<47",
    "diskcache>=5.6.3",
    "emoji",
    "factorio-rcon-py",
    "fonttools",
    "hikari-lightbulb~=3.2.3",
    "hikari-ui",
    "hikari-wave>=0.7.0a1",
    "hikari[speedups]~=2.5.0",
    "httpx",
    "modmux",
    "nicegui>=3.12.0",
    "pathvalidate",
    "piper-tts",
    "psutil",
    "py7zr",
    "pydantic",
    "pydantic-settings",
    "python-dateutil",
    "regex",
    "requests",
    "satisfactory-api-client>=0.2.1",
    "tenorgrabber",
    "tomli_w",
    "uvloop; platform_system != 'Windows'",
    "yt-dlp",
]

[dependency-groups]
dev = [
    "basedpyright",
    "playwright",
]

[tool.uv]
package = false
default-groups = ["dev"]
# The Satisfactory API client has an obsolete upper bound; its dotenv usage is
# covered by the dashboard regression suite against the current secure release.
override-dependencies = ["python-dotenv>=1.2.2"]

[tool.uv.sources]
hikari-ui = { path = "../hikari_editor" }

[tool.pytest.ini_options]
python_files = ["*_check.py"]
testpaths = ["checks"]

[tool.ruff.lint]
# Keep Ruff focused on deterministic source hygiene; BasedPyright owns type analysis.
select = ["E731", "F401", "F402", "F811"]

[tool.basedpyright]
include = [
    "*.py",
    "apps",
    "web_dash",
]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/.git",
    "**/.hg",
    "**/.svn",
    ".venv",
    "data",
    "dev_apps",
    "logs",
    "opt",
    "tmp",
    "voices",
    "**/.*",
]
pythonVersion = "3.14"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
typeCheckingMode = "recommended"
useLibraryCodeForTypes = true
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportIgnoreCommentWithoutRule = "warning"
reportUnreachable = "information"
reportAny = "information"
reportExplicitAny = "information"
reportUnknownArgumentType = "information"
reportUnknownLambdaType = "information"
reportUnknownMemberType = "information"
reportUnknownParameterType = "information"
reportUnknownVariableType = "information"
reportImplicitOverride = "none"
reportImplicitStringConcatenation = "none"
reportPrivateUsage = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportMissingParameterType = "information"
reportPrivateLocalImportUsage = "information"
reportUnnecessaryCast = "information"
reportUnnecessaryComparison = "information"
reportUnnecessaryIsInstance = "information"
reportUnnecessaryTypeIgnoreComment = "information"
reportUnusedFunction = "information"
reportUnusedParameter = "information"
reportUnusedVariable = "information"
